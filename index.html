<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kaybolan litreler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Semi+Condensed:wght@600&display=swap">
<style>
/* Layout: one column game under a sticky progress bar, blocks in a dock at the bottom; the warm paper look of the training deck, one deliberate light theme so phones match the projector. */
:root {
  --zemin: #EFE7DA;
  --yuzey: #F9F5EE;
  --kagit: #FFFCF6;
  --cizgi: #DDD2C0;
  --kesik: #B8AC99;
  --metin: #2A241C;
  --metin2: #6A5F50;
  --metin-h: #43392D;
  --vurgu: #C9471A;
  --vurgu-zemin: #F5E1D5;
  --vurgu-acik: #F08B5E;
  --tus-metin: #F9F5EE;
  --ozet-cizgi: #4A4034;
  --ozet-metin2: #D9CDBB;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif;
  --govde: 'Barlow', Arial, Helvetica, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--zemin); color: var(--metin); font-family: var(--govde); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--vurgu); outline-offset: 2px; }
.ik { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--zemin); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--zemin); border-bottom: 1px solid var(--cizgi); }
.bar-in { max-width: 760px; margin: 0 auto; padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 16px; }
.marka { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marka b { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1; white-space: nowrap; }
.marka span { font-size: 14px; color: var(--metin2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.puan { position: relative; display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.puan span { font-size: 13px; color: var(--metin2); }
.puan b { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1; min-width: 2ch; text-align: right; }
.fark { position: absolute; right: 0; top: -14px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; }
.fark.art { color: var(--metin); }
.fark.eks { color: var(--vurgu); }
.fark.oyna { animation: yuksel 1s ease-out; }
@keyframes yuksel { 0% { opacity: 0; transform: translateY(8px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px); } }
.adimlar { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.adimlar li { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 12px; color: var(--metin2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adimlar li::before { content: ""; height: 4px; border-radius: 2px; background: var(--cizgi); transition: background .3s; }
.adimlar li.gecti::before { background: var(--metin2); }
.adimlar li.simdi { color: var(--metin); font-weight: 500; }
.adimlar li.simdi::before { background: var(--vurgu); }

.ekran { max-width: 760px; margin: 0 auto; padding-block: 28px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sahne { display: flex; flex-direction: column; gap: 22px; }
.baslik { display: flex; flex-direction: column; gap: 8px; }
.ust { margin: 0; font-size: 15px; font-weight: 500; color: var(--metin2); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(36px, 7.4vw, 54px); line-height: 1.02; text-wrap: balance; }
.giris-metin { margin: 0; font-size: 18px; line-height: 1.5; color: var(--metin2); max-width: 58ch; }
.tus { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 24px; border-radius: 999px; font-size: 17px; font-weight: 500; cursor: pointer; transition: background .2s, border-color .2s, color .2s, transform .1s; }
.tus:active { transform: scale(.98); }
.tus.ana { background: var(--metin); border: 2px solid var(--metin); color: var(--tus-metin); }
.tus.ana:hover { background: var(--metin-h); border-color: var(--metin-h); }
.tus.ikincil { background: transparent; border: 2px solid var(--metin2); color: var(--metin); }
.tus.ikincil:hover { background: var(--yuzey); }
.tus.ikincil[aria-pressed="true"] { background: var(--metin); border-color: var(--metin); color: var(--tus-metin); }
.tus.acik { background: var(--yuzey); border: 2px solid var(--yuzey); color: var(--metin); align-self: flex-start; }
.tus.acik:hover { background: var(--kagit); }
.tus .ik { width: 20px; height: 20px; }

.kahraman { display: block; width: 100%; height: auto; max-width: 100%; }
.sv-c { fill: var(--yuzey); stroke: var(--metin2); stroke-width: 2; }
.sv-s { fill: none; stroke: var(--metin2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sv-boru { fill: none; stroke: var(--kesik); stroke-width: 2; stroke-dasharray: 5 5; animation: akis 1.4s linear infinite; }
.sv-teslim { fill: none; stroke: var(--vurgu); stroke-width: 2.5; stroke-dasharray: 6 6; stroke-linecap: round; animation: akis 1.1s linear infinite; }
.sv-tel { fill: none; stroke: var(--kesik); stroke-width: 1.5; stroke-dasharray: 3 5; }
.sv-pkt { fill: var(--vurgu); }
.sv-k { font: 500 14px var(--govde); fill: var(--metin2); }
.sv-b { font: 600 32px var(--display); fill: var(--vurgu); }
.sv-e { font: 500 16px var(--govde); fill: var(--metin2); }
@keyframes akis { to { stroke-dashoffset: -24; } }
.adim-l { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.adim-l li { background: var(--yuzey); border: 2px solid var(--cizgi); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.adim-l .n { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--cizgi); display: grid; place-items: center; font-family: var(--display); font-weight: 600; font-size: 16px; color: var(--metin2); flex: none; }
.adim-l div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.adim-l b { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1.05; }
.adim-l .s { font-size: 15px; line-height: 1.3; color: var(--metin2); }
.masa { display: flex; flex-direction: column; gap: 8px; }
.masa label { font-size: 15px; font-weight: 500; }
.masa-s { display: flex; gap: 10px; flex-wrap: wrap; }
.masa input { flex: 1 1 200px; min-width: 0; height: 50px; border-radius: 12px; border: 2px solid var(--cizgi); background: var(--kagit); padding: 0 16px; font-size: 17px; }
.masa input::placeholder { color: var(--kesik); }
.masa input:focus { border-color: var(--metin2); outline: none; }
.masa .tus { flex: 0 0 auto; }
.ince { margin: 0; font-size: 14px; color: var(--metin2); }

.kpi { background: var(--yuzey); border: 2px solid var(--cizgi); border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 16px 32px; align-items: center; }
.kpi-l, .kpi-a { margin: 0; font-size: 14px; color: var(--metin2); }
.kpi-l { font-weight: 500; }
.kpi-d { margin: 2px 0 4px; font-family: var(--display); font-weight: 600; font-size: 80px; line-height: .95; color: var(--vurgu); font-variant-numeric: tabular-nums; }
.kpi-sag { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.cubuk { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; align-items: center; font-size: 14px; }
.cubuk span:first-child { color: var(--metin2); }
.cubuk b { font-weight: 500; font-variant-numeric: tabular-nums; }
.cubuk i { grid-column: 1 / -1; display: block; height: 10px; border-radius: 5px; background: var(--zemin); overflow: hidden; }
.cubuk i::after { content: ""; display: block; height: 100%; width: var(--w); border-radius: 5px; background: var(--metin2); }
.cubuk.v i::after { background: var(--vurgu); }
.hikaye { display: flex; flex-direction: column; gap: 12px; font-size: 18px; line-height: 1.6; max-width: 62ch; }
.hikaye p { margin: 0; }
.formul { display: flex; flex-direction: column; gap: 10px; }
.formul-b { margin: 0; font-size: 15px; font-weight: 500; color: var(--metin2); }
.formul-s { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.formul-s span { padding: 6px 14px; border-radius: 999px; border: 2px solid var(--cizgi); background: var(--yuzey); font-size: 15px; font-weight: 500; white-space: nowrap; }
.formul-s span.v { border-color: var(--vurgu); color: var(--vurgu); }
.formul-s em { font-style: normal; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1; color: var(--metin2); }
.karar { background: var(--yuzey); border: 2px solid var(--cizgi); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.karar-s { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; text-wrap: balance; }
.secenek { display: flex; gap: 10px; flex-wrap: wrap; }
.secenek .tus { flex: 1 1 200px; }
.karar-not { margin: 0; font-size: 15px; color: var(--metin2); }
.karar-not:empty { display: none; }
.karar-not.uyari { color: var(--vurgu); }
.ileri { display: flex; }

.ipucu { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--metin2); }
.ust-s { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.sure { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; color: var(--metin); font-variant-numeric: tabular-nums; }
.sure.doldu { color: var(--vurgu); }
.sure .ik { width: 18px; height: 18px; }
.hatlar { display: flex; flex-direction: column; gap: 12px; }
.hat { background: var(--yuzey); border: 2px solid var(--cizgi); border-radius: 16px; padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color .3s; }
.hat.tamam { border-color: var(--metin2); }
.hat-ust { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 28px; }
.hat-ust h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 22px; line-height: 1; }
.hat-etiket { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--metin2); padding: 3px 10px; border-radius: 999px; border: 1.5px solid var(--cizgi); opacity: 0; transform: translateY(4px); transition: opacity .4s, transform .4s; white-space: nowrap; }
.hat.tamam .hat-etiket { opacity: 1; transform: none; }
.hat-etiket.elle { color: var(--vurgu); border-color: var(--vurgu); }
.hat-etiket .ik { width: 15px; height: 15px; }
.zincir { display: grid; grid-template-columns: minmax(0, 1fr) 18px minmax(0, 1fr) 18px minmax(0, 1fr) 18px 60px; align-items: center; }
.yuva { height: 78px; min-width: 0; border-radius: 12px; border: 2px dashed var(--kesik); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 6px 4px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
.yuva-n { font-family: var(--display); font-weight: 600; font-size: 18px; color: var(--kesik); }
.yuva:hover { border-color: var(--metin2); }
.secim-var .yuva:not(.dolu) { border-color: var(--metin2); background: var(--kagit); }
.yuva.hedef, .secim-var .yuva.hedef { border-color: var(--vurgu); background: var(--vurgu-zemin); }
.yuva.hedef .yuva-n { color: var(--vurgu); }
.yuva.dolu { border: 2px solid var(--cizgi); background: var(--kagit); cursor: default; }
.yuva.dolu .ik { width: 24px; height: 24px; color: var(--metin2); }
.yuva.dolu span { font-size: 13px; font-weight: 500; line-height: 1.15; overflow-wrap: anywhere; }
.yuva.yeni { animation: otur .4s ease-out; }
.yuva.salla { animation: salla .4s; }
@keyframes otur { 0% { transform: scale(.9); } 60% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes salla { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
.tel { position: relative; height: 0; border-top: 2px dashed var(--kesik); margin-inline: 3px; }
.hat.tamam .tel { border-top-style: solid; border-top-color: var(--metin2); }
.tel i { position: absolute; top: -6px; left: -5px; width: 10px; height: 10px; border-radius: 50%; background: var(--vurgu); opacity: 0; }
.hat.tamam .tel i { animation: paket 1.8s linear infinite; }
.hat.tamam .tel:nth-of-type(2) i { animation-delay: .45s; }
.hat.tamam .tel:nth-of-type(3) i { animation-delay: .9s; }
@keyframes paket { 0% { left: -5px; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 5px); opacity: 0; } }
.uc { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
.uc .ik { width: 38px; height: 38px; padding: 7px; border-radius: 50%; border: 2px solid var(--cizgi); background: var(--kagit); color: var(--metin2); transition: border-color .3s, color .3s; }
.hat.tamam .uc .ik { border-color: var(--vurgu); color: var(--vurgu); }
.uc span { font-size: 11px; line-height: 1.1; color: var(--metin2); }

.dok { position: sticky; bottom: 0; z-index: 4; background: var(--zemin); padding-block: 10px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -1px 0 var(--cizgi); }
.not { min-height: 62px; display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--kagit); border: 1.5px solid var(--cizgi); font-size: 15px; line-height: 1.4; }
.not .ik { width: 22px; height: 22px; margin-top: 1px; color: var(--metin2); }
.not b { display: block; font-weight: 500; }
.not p { margin: 0; color: var(--metin2); }
.not.iyi { border-color: var(--metin2); }
.not.iyi .ik { color: var(--metin); }
.not.hata { border-color: var(--vurgu); background: var(--vurgu-zemin); }
.not.hata .ik, .not.hata b { color: var(--vurgu); }
.not.yanip { animation: yanip .45s ease-out; }
@keyframes yanip { 0% { transform: translateY(3px); opacity: .6; } 100% { transform: none; opacity: 1; } }
.bloklar { display: flex; flex-wrap: wrap; gap: 8px; }
.blok { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 7px 14px 7px 10px; border-radius: 12px; border: 2px solid var(--cizgi); background: var(--kagit); font-size: 15px; font-weight: 500; line-height: 1.15; text-align: left; cursor: pointer; transition: border-color .2s, background .2s; }
.blok .ik { width: 22px; height: 22px; color: var(--metin2); }
.blok:hover { border-color: var(--metin2); }
.blok.secili { border-color: var(--vurgu); background: var(--vurgu-zemin); }
.blok.secili .ik { color: var(--vurgu); }

.ozet { background: var(--metin); color: var(--tus-metin); border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 14px; }
.ozet h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.05; text-wrap: balance; }
.ozet-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.ozet-l li { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--ozet-cizgi); font-size: 15px; }
.ozet-l li:last-child { border-bottom: 1px solid var(--ozet-cizgi); }
.ozet-l b { font-family: var(--display); font-weight: 600; font-size: 20px; }
.ozet-l span { display: inline-flex; align-items: center; gap: 6px; }
.ozet-l span:last-child { color: var(--ozet-metin2); text-align: right; }
.ozet-l .ik { width: 17px; height: 17px; }
.ozet-l li.elle span:nth-of-type(1) { color: var(--vurgu-acik); }
.ozet p { margin: 0; font-size: 16px; line-height: 1.55; color: var(--ozet-metin2); max-width: 60ch; }
.ozet p.ozet-skor { color: var(--tus-metin); font-weight: 500; }

.alt { max-width: 760px; margin: 0 auto; padding-block: 18px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13px; color: var(--metin2); }
.alt button { background: none; border: 0; padding: 6px 0; color: var(--metin2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 13px; }
.alt button[data-onay] { color: var(--vurgu); }

@media (min-width: 700px) {
  .zincir { grid-template-columns: minmax(0, 1fr) 40px minmax(0, 1fr) 40px minmax(0, 1fr) 40px 66px; }
}
@media (max-width: 560px) {
  .hatlar { gap: 10px; }
  .hat { padding: 10px 10px 12px; gap: 8px; }
  .hat-ust h2 { font-size: 20px; }
  .hat-etiket { font-size: 12px; padding: 2px 8px; }
  .yuva { height: 68px; }
  .dok { gap: 8px; padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .not { min-height: 52px; padding: 8px 12px; font-size: 14px; }
  .not .ik { width: 20px; height: 20px; }
  .bloklar { display: grid; grid-auto-flow: column; grid-template-rows: repeat(2, auto); grid-auto-columns: max-content; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; scrollbar-width: none; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding-inline: max(16px, env(safe-area-inset-left, 0px)); scroll-padding-inline: max(16px, env(safe-area-inset-left, 0px)); padding-bottom: 2px; }
  .bloklar::-webkit-scrollbar { display: none; }
  .blok { scroll-snap-align: start; }
  .adim-l { grid-template-columns: minmax(0, 1fr); }
  .adim-l li { flex-direction: row; align-items: center; gap: 12px; padding: 12px 14px; }
  .kpi { grid-template-columns: minmax(0, 1fr); }
  .hikaye { font-size: 17px; }
  .giris-metin { font-size: 17px; }
  .blok { font-size: 14px; min-height: 42px; padding: 6px 12px 6px 8px; }
  .blok .ik { width: 20px; height: 20px; }
  .ozet-l li { grid-template-columns: 84px minmax(0, 1fr) auto; }
}
@media (max-width: 380px) {
  .zincir { grid-template-columns: minmax(0, 1fr) 12px minmax(0, 1fr) 12px minmax(0, 1fr) 12px 52px; }
  .yuva.dolu span { font-size: 12px; }
  .marka span { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .sv-pkt { display: none; }
  .sv-boru, .sv-teslim, .hat.tamam .tel i, .yuva.yeni, .yuva.salla, .not.yanip, .fark.oyna { animation: none; }
  .hat.tamam .tel i { opacity: 0; }
}
</style>

</head>

          }
        } else tam = false;
        el.classList.toggle('hedef', U.hedef === k);
      }
      $('#h-' + h).classList.toggle('tamam', tam);
    });
    var kullanilan = {};
    Object.keys(yer).forEach(function (k) { kullanilan[yer[k]] = true; });
    TEPSI.forEach(function (id) {
      var b = $('#b-' + id);
      b.hidden = !!kullanilan[id];
      b.classList.toggle('secili', U.secili === id);
      b.setAttribute('aria-pressed', U.secili === id ? 'true' : 'false');
    });
    $('#dok').hidden = S.r1.bitti;
    var oz = $('#ozet');
    if (S.r1.bitti) { oz.innerHTML = ozetHtml(); oz.hidden = false; } else oz.hidden = true;
  }

  function salla(k) {
    var el = $('#y-' + k);
    if (!el) return;
    el.classList.remove('salla');
    void el.offsetWidth;
    el.classList.add('salla');
  }

  function blokTik(id) {
    if (S.r1.bitti) return;
    if (U.hedef) { yerlestir(id, U.hedef); return; }
    U.secili = U.secili === id ? null : id;
    notYaz(U.secili ? { tip: 'bilgi', baslik: B[id].ad, metin: B[id].acik + ' Şimdi yerini seçin.' } : null);
    r1Guncelle(false);
  }

  function yuvaTik(h, i) {
    if (S.r1.bitti) return;
    var k = h + '-' + i, dolu = S.r1.yer[k];
    if (dolu) { notYaz({ tip: 'bilgi', baslik: B[dolu].ad, metin: B[dolu].acik }); return; }
    if (U.secili) { yerlestir(U.secili, k); return; }
    U.hedef = U.hedef === k ? null : k;
    notYaz(U.hedef ? { tip: 'bilgi', baslik: HATLAR[h].ad + ' hattı, ' + (i + 1) + '. yuva', metin: 'Buraya hangi blok gelir? Aşağıdan seçin.' } : null);
    r1Guncelle(false);
  }

  function yerlestir(id, k) {
    var p = k.split('-'), h = p[0], i = +p[1], b = B[id];
    U.secili = null; U.hedef = null;
    if (b.tuzak) {
      S.r1.hata++; puanEkle(-5); salla(k);
      notYaz({ tip: 'hata', baslik: b.ad + ' bu hesaba girmez', metin: b.acik });
    } else if (b.hat.indexOf(h) > -1 && b.sira === i) {
      S.r1.yer[k] = id; puanEkle(10);
      var tam = [0, 1, 2].every(function (j) { return S.r1.yer[h + '-' + j]; });
      notYaz(tam ? { tip: 'iyi', baslik: HATLAR[h].ad + ' hattı tamam', metin: HATLAR[h].bitti } : { tip: 'iyi', baslik: b.ad + ' yerine oturdu', metin: b.acik });
      S.r1.bitti = SIRA.every(function (hh) { return [0, 1, 2].every(function (j) { return S.r1.yer[hh + '-' + j]; }); });
    } else if (b.hat.indexOf(h) > -1) {
      S.r1.hata++; puanEkle(-5); salla(k);
      notYaz({ tip: 'hata', baslik: b.ad + ' bu hatta ama sırası farklı', metin: 'Veri bu hatta önce nerede doğuyor, sonra nereye gidiyor?' });
    } else {
      S.r1.hata++; puanEkle(-5); salla(k);
      notYaz({ tip: 'hata', baslik: b.ad + ' ' + HATLAR[h].ad.toLocaleLowerCase('tr') + ' hattına ait değil', metin: b.acik });
    }
    kaydet();
    r1Guncelle(false);
    if (S.r1.bitti) {
      sureCiz();
      var oz = $('#ozet');
      setTimeout(function () { oz.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); }, 700);
    }
  }

  function sureCiz() {
    var el = $('#sure');
    if (!el) return;
    if (S.r1.bitti) { el.innerHTML = ikon('check') + 'Tamam'; el.classList.remove('doldu'); return; }
    var kalan = SURE - Math.floor((Date.now() - (S.r1.t0 || Date.now())) / 1000);
    if (kalan <= 0) { el.innerHTML = ikon('saat') + 'Süre doldu'; el.classList.add('doldu'); return; }
    var m = Math.floor(kalan / 60), s = kalan % 60;
    el.innerHTML = ikon('saat') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  $('#ekran').addEventListener('submit', function (e) {
    if (e.target.id !== 'masa-form') return;
    e.preventDefault();
    S.masa = ($('#masa').value || '').trim().slice(0, 24);
    git('vaka');
  });

  $('#ekran').addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.karar) { S.karar1 = t.dataset.karar; kaydet(); vakaGuncelle(); return; }
    if (t.id === 'r1-gec') {
      if (!S.karar1) { var n = $('#karar-not'); n.textContent = 'Önce bir karar seçin, sonra 1. tura geçin.'; n.className = 'karar-not uyari'; return; }
      git('r1'); return;
    }
    if (t.dataset.blok) { blokTik(t.dataset.blok); return; }
    if (t.classList.contains('yuva')) { yuvaTik(t.dataset.hat, +t.dataset.sira); return; }
    if (t.id === 'r2-gec') { git('r2'); return; }
    if (t.id === 'r1-don') { git('r1'); return; }
  });

  var sifirla = $('#sifirla'), onayZaman = null;
  sifirla.addEventListener('click', function () {
    if (sifirla.dataset.onay) {
      clearTimeout(onayZaman);
      delete sifirla.dataset.onay;
      sifirla.textContent = 'Baştan başla';
      S = yeni(); U = { secili: null, hedef: null, not: null };
      kaydet(); ciz(); window.scrollTo(0, 0);
      return;
    }
    sifirla.dataset.onay = '1';
    sifirla.textContent = 'Emin misiniz? Tekrar dokunun';
    onayZaman = setTimeout(function () { delete sifirla.dataset.onay; sifirla.textContent = 'Baştan başla'; }, 3500);
  });

  setInterval(sureCiz, 1000);

  function baslat(data) {
    S = birlestir(data && data.ekran ? data : yukle());
    U = { secili: null, hedef: null, not: null };
    ciz();
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return S; }); } catch (e) {}
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(baslat); else baslat(hot && hot.data ? hot.data : {});
})();
</script>
</body>
</html>
