<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Doğru kolonlar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600&display=swap">
<style>
/* Layout: one column game under a sticky progress bar; data screen with the two year record and day filters, then column cards with a sticky selection dock; the warm paper look of the training deck, one deliberate light theme so phones match the projector. */
:root {
  --zemin: #EFE7DA; --yuzey: #F9F5EE; --kagit: #FFFCF6; --cizgi: #DDD2C0; --kesik: #B8AC99;
  --metin: #2A241C; --metin2: #6A5F50; --metin-h: #43392D; --vurgu: #C9471A;
  --tus-metin: #F9F5EE; --ozet-metin2: #D9CDBB; --ozet-cizgi: #4A4034;
  --display: 'Barlow Semi Condensed', 'Arial Narrow', Arial, sans-serif; --govde: 'Barlow', Arial, Helvetica, sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(100px + env(safe-area-inset-top, 0px)); }
body { margin: 0; background: var(--zemin); color: var(--metin); font-family: var(--govde); font-size: 16px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--vurgu); outline-offset: 2px; }
[hidden] { display: none !important; }
.ik { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--zemin); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--zemin); border-bottom: 1px solid var(--cizgi); }
.bar-in { max-width: 820px; margin: 0 auto; padding-block: 12px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 16px; }
.marka { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.marka b { font-family: var(--display); font-weight: 600; font-size: 21px; line-height: 1; white-space: nowrap; }
.marka span { font-size: 14px; color: var(--metin2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.enIyi { display: flex; align-items: baseline; gap: 6px; font-variant-numeric: tabular-nums; }
.enIyi span { font-size: 13px; color: var(--metin2); }
.enIyi b { font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1; }
.adimlar { grid-column: 1 / -1; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.adimlar li { display: flex; flex-direction: column; gap: 5px; min-width: 0; font-size: 12px; color: var(--metin2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.adimlar li::before { content: ""; height: 4px; border-radius: 2px; background: var(--cizgi); transition: background .3s; }
.adimlar li.gecti::before { background: var(--metin2); }
.adimlar li.simdi { color: var(--metin); font-weight: 500; }
.adimlar li.simdi::before { background: var(--vurgu); }

.ekran { max-width: 820px; margin: 0 auto; padding-block: 28px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sahne { display: flex; flex-direction: column; gap: 22px; }
.baslik { display: flex; flex-direction: column; gap: 10px; }
.ust { margin: 0; font-size: 15px; font-weight: 500; color: var(--metin2); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(36px, 7.4vw, 54px); line-height: 1.02; text-wrap: balance; }
h2 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 26px; line-height: 1.1; }
.giris-metin { margin: 0; font-size: 18px; line-height: 1.5; color: var(--metin2); max-width: 60ch; }
.not { font-size: 14px; color: var(--metin2); margin: 0; }

.tus { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 10px 24px; border-radius: 999px; font-size: 17px; font-weight: 500; cursor: pointer; transition: background .2s, border-color .2s, color .2s, transform .1s; }
.tus:active { transform: scale(.98); }
.tus.ana { background: var(--metin); border: 2px solid var(--metin); color: var(--tus-metin); }
.tus.ana:hover { background: var(--metin-h); border-color: var(--metin-h); }
.tus.ana:disabled { background: var(--kesik); border-color: var(--kesik); cursor: not-allowed; transform: none; }
.tus.ikincil { background: transparent; border: 2px solid var(--metin2); color: var(--metin); }
.tus.ikincil:hover { background: var(--yuzey); }
.ileri { display: flex; flex-wrap: wrap; gap: 12px; }
.metin-tus { background: none; border: 0; padding: 0; font-size: inherit; font-weight: 500; color: var(--metin); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

.kart { background: var(--yuzey); border: 2px solid var(--cizgi); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.kahraman { display: block; width: 100%; height: auto; }
.form { display: flex; flex-direction: column; gap: 10px; }
.form label { font-weight: 500; }
.form input { min-height: 52px; border-radius: 14px; border: 2px solid var(--kesik); background: var(--kagit); padding: 10px 16px; font-size: 18px; }
.kural { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.kural li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 12px; align-items: start; font-size: 16px; }
.rozet { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; border: 2px solid var(--cizgi); font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--metin2); }

.kpi { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 16px; }
.kpi-l { margin: 0; font-size: 15px; font-weight: 500; color: var(--metin2); }
.kpi-a { margin: 4px 0 0; font-size: 15px; color: var(--metin2); }
.kpi-d { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(56px, 14vw, 88px); line-height: .9; color: var(--vurgu); font-variant-numeric: tabular-nums; }

/* veri ekranı */
.filtreler { display: flex; flex-direction: column; gap: 10px; }
.filtre { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 14px; border: 2px solid var(--cizgi); background: var(--kagit); cursor: pointer; transition: border-color .15s; }
.filtre .kutu { width: 24px; height: 24px; border-radius: 6px; border: 2px solid var(--kesik); display: grid; place-items: center; background: var(--kagit); }
.filtre .kutu .ik { width: 15px; height: 15px; stroke-width: 2.6; opacity: 0; }
.filtre[aria-pressed="true"] { border-color: var(--metin); }
.filtre[aria-pressed="true"] .kutu { background: var(--metin); border-color: var(--metin); color: var(--tus-metin); }
.filtre[aria-pressed="true"] .kutu .ik { opacity: 1; }
.filtre b { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
.filtre .a { display: block; margin-top: 2px; font-size: 14px; line-height: 1.35; color: var(--metin2); }
.filtre em { font-style: normal; font-size: 14px; color: var(--metin2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ogrenme { margin: 0; font-size: 15px; color: var(--metin2); }
.ogrenme b { color: var(--metin); font-weight: 600; font-variant-numeric: tabular-nums; }

/* kolon kartları */
.deneme-b { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; font-size: 15px; color: var(--metin2); }
.hak { display: inline-flex; gap: 6px; }
.hak i { width: 12px; height: 12px; border-radius: 999px; border: 2px solid var(--metin2); }
.hak i.dolu { background: var(--metin2); }
.kolonlar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kolonlar > .kol:last-child { grid-column: 1 / -1; min-height: 0; }
.kol { position: relative; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 120px; padding: 14px 14px 12px; border-radius: 14px; border: 2px solid var(--cizgi); background: var(--yuzey); cursor: pointer; transition: border-color .15s, background .15s, transform .1s; }
button.kol:active { transform: scale(.98); }
.kol b { font-size: 16px; font-weight: 600; line-height: 1.2; padding-right: 26px; }
.kol span { font-size: 14px; line-height: 1.35; color: var(--metin2); }
.kol em { margin-top: auto; padding-top: 6px; font-style: normal; font-size: 13px; color: var(--metin2); font-variant-numeric: tabular-nums; }
.kol .isaret { position: absolute; top: 12px; right: 12px; width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--kesik); display: grid; place-items: center; background: var(--kagit); }
.kol .isaret .ik { width: 14px; height: 14px; stroke-width: 2.4; opacity: 0; }
.kol.secili { border-color: var(--metin); background: var(--kagit); }
.kol.secili .isaret { background: var(--metin); border-color: var(--metin); color: var(--tus-metin); }
.kol.secili .isaret .ik { opacity: 1; }
.kol:disabled { cursor: not-allowed; border-style: dashed; border-color: var(--kesik); background: transparent; transform: none; }
.kol:disabled b, .kol:disabled span { color: var(--metin2); }
.kol:disabled em { color: var(--vurgu); font-weight: 500; }
.kol:disabled .isaret { display: none; }
.kol.genis { grid-column: 1 / -1; padding: 0; gap: 0; cursor: default; }
.kol-ust { display: flex; flex-direction: column; gap: 4px; width: 100%; padding: 14px 14px 10px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; }
.donusum { display: flex; flex-direction: column; gap: 8px; padding: 0 14px 14px; }
.don-l { margin: 0; font-size: 14px; font-weight: 500; color: var(--metin); }
.secmeli { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; max-width: 420px; padding: 4px; border-radius: 12px; background: var(--zemin); }
.secmeli button { min-height: 40px; padding: 6px 10px; border: 0; border-radius: 9px; background: transparent; font-size: 15px; font-weight: 500; color: var(--metin2); cursor: pointer; }
.secmeli button[aria-checked="true"] { background: var(--kagit); color: var(--metin); box-shadow: inset 0 0 0 2px var(--metin); }
.kol .don-a { margin: 0; font-size: 14px; line-height: 1.4; color: var(--metin2); }
.kol .don-a em { display: block; margin: 0; padding-top: 6px; }
.kol.salla { animation: salla .35s; }
@keyframes salla { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.dok { position: sticky; bottom: 0; z-index: 4; background: var(--zemin); margin-top: -8px; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -1px 0 var(--cizgi); }
.cipler { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cip { display: inline-flex; align-items: center; min-height: 30px; padding: 3px 12px; border-radius: 999px; background: var(--metin); color: var(--tus-metin); border: 2px solid var(--metin); font-size: 14px; font-weight: 500; line-height: 1.2; }
.cip.bos { background: transparent; color: var(--metin2); border: 2px dashed var(--kesik); }
.cip.acik { background: var(--yuzey); color: var(--metin); }
.dok-alt { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dok-sol { display: flex; align-items: center; gap: 10px; min-width: 0; }
.yuvalar { display: none; gap: 4px; flex: none; }
.yuvalar i { width: 14px; height: 14px; border-radius: 4px; border: 2px dashed var(--kesik); }
.yuvalar i.dolu { border: 2px solid var(--metin); background: var(--metin); }
#sayac { font-size: 15px; line-height: 1.3; color: var(--metin2); }
#sayac.uyari { color: var(--vurgu); font-weight: 500; }
@media (max-width: 559px) {
  .dok { margin-top: -10px; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); }
  .dok #secilen { display: none; }
  .yuvalar { display: inline-flex; }
  #sayac { font-size: 14px; }
}

/* sonuç */
.yukle { padding: 26px 18px; }
.yukle-c { height: 8px; border-radius: 4px; background: var(--cizgi); overflow: hidden; }
.yukle-c i { display: block; height: 100%; width: 0; background: var(--metin); border-radius: 4px; animation: dol 1s ease-in-out forwards; }
@keyframes dol { to { width: 100%; } }
.grafik { width: 100%; }
.grafik svg { display: block; width: 100%; height: auto; overflow: visible; }
.gr-y { font: 400 12px var(--govde); fill: var(--metin2); font-variant-numeric: tabular-nums; }
.gr-x { font: 400 12px var(--govde); fill: var(--metin2); }
.gr-b { font: 500 12px var(--govde); fill: var(--metin); }
.lejant { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--metin2); }
.lejant span { display: inline-flex; align-items: center; gap: 8px; }
.lejant i { width: 22px; height: 4px; border-radius: 2px; background: var(--metin); }
.lejant i.t { background: var(--vurgu); }
.lejant i.g { background: var(--kesik); }
.lejant i.h { height: 14px; width: 14px; border-radius: 3px; background: var(--zemin); border: 1px solid var(--cizgi); }
.kiyas { display: flex; flex-direction: column; gap: 8px; }
.kiyas div { display: grid; grid-template-columns: 92px minmax(0, 1fr) 58px; align-items: center; gap: 10px; font-size: 15px; }
.kiyas .iz { height: 14px; border-radius: 7px; background: var(--zemin); overflow: hidden; }
.kiyas .iz i { display: block; height: 100%; border-radius: 7px; background: var(--kesik); }
.kiyas .sen .iz i { background: var(--metin); }
.kiyas b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.katki { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.katki li { display: flex; flex-direction: column; gap: 6px; }
.katki li.grup { font-size: 14px; font-weight: 600; color: var(--metin2); padding-top: 4px; border-top: 1px solid var(--cizgi); padding-block: 12px 0; }
.katki li.grup:first-child { border-top: 0; padding-top: 0; }
.k-ust { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 15px; }
.k-ust b { font-weight: 600; }
.k-ust span { color: var(--metin2); text-align: right; white-space: nowrap; }
.katki .iz { height: 10px; border-radius: 5px; background: var(--zemin); overflow: hidden; }
.katki .iz i { display: block; height: 100%; border-radius: 5px; background: var(--metin); }
.katki li.eksi .k-ust span { color: var(--vurgu); font-weight: 500; }
.katki li.eksi .iz i { background: var(--vurgu); }
.ipucu { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; margin: 0; padding: 14px 16px; border-radius: 14px; background: var(--kagit); border: 2px solid var(--cizgi); font-size: 15px; }
.ipucu .ik { color: var(--metin2); margin-top: 1px; }
.tuzak { border: 3px solid var(--vurgu); background: var(--kagit); }
.buyuk { margin: 0; font-family: var(--display); font-weight: 600; font-size: clamp(56px, 14vw, 88px); line-height: .9; color: var(--vurgu); font-variant-numeric: tabular-nums; }
.gecmis { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.gecmis li { display: grid; grid-template-columns: 76px minmax(0, 1fr) 74px; gap: 10px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--cizgi); font-size: 15px; }
.gecmis li:first-child { border-top: 0; padding-top: 0; }
.gecmis li > span:first-child { color: var(--metin2); }
.gecmis li small { display: block; margin-top: 2px; font-size: 13px; color: var(--metin2); }
.gecmis li b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.gecmis li.en b { color: var(--vurgu); }
.gecmis li.yok b { color: var(--metin2); font-weight: 500; }
.kurulum { display: flex; flex-direction: column; gap: 8px; }
.kurulum p { margin: 0; font-size: 14px; font-weight: 500; color: var(--metin2); }
.ozet { background: var(--metin); color: var(--tus-metin); border-radius: 16px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.ozet h2 { font-size: 28px; }
.ozet p { margin: 0; color: var(--ozet-metin2); font-size: 16px; }
.ozet-l { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.ozet-l li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: start; }
.ozet-l .rozet { width: 30px; height: 30px; border-color: var(--ozet-cizgi); color: var(--ozet-metin2); font-size: 16px; }
.ozet-l b { display: block; font-size: 17px; font-weight: 600; color: var(--tus-metin); }
.ozet .son { padding-top: 14px; border-top: 1px solid var(--ozet-cizgi); color: var(--tus-metin); font-weight: 500; }

.alt { max-width: 820px; margin: 0 auto; padding-block: 18px calc(24px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--metin2); }
.alt button { background: none; border: 0; padding: 0; font-size: 13px; color: var(--metin2); text-decoration: underline; cursor: pointer; }
@media (min-width: 700px) {
  .kolonlar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kolonlar > .kol:last-child { grid-column: auto; min-height: 112px; }
  .kol { min-height: 112px; padding: 16px 16px 14px; }
  .kol.genis { padding: 0; }
  .kol-ust { padding: 16px 16px 10px; }
  .donusum { padding: 0 16px 16px; }
}
@media (prefers-reduced-motion: reduce) { .yukle-c i { animation-duration: .01s; } .kol.salla { animation: none; } }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ok" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-tik" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-bilgi" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></symbol>
  <symbol id="i-geri" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
</svg>

<header class="bar">
  <div class="bar-in">
    <div class="marka"><b>Doğru kolonlar</b><span id="masa-ad"></span></div>
    <div class="enIyi" aria-live="polite"><span>En iyi hata</span><b id="en-iyi">?</b></div>
    <ol class="adimlar" id="adimlar"><li>Vaka</li><li>Veri</li><li>Kolonlar</li><li>Sonuç</li><li>Kapanış</li></ol>
  </div>
</header>
<main class="ekran" id="ekran"></main>
<footer class="alt"><span>Şirket ve rakamlar kurgusaldır</span><button type="button" id="sifirla">Baştan başla</button></footer>

    var tesadufi = k.filter(function (x) { return x.tur === 'kol' && ILGISIZ[x.id] && x.d >= ESIK; })[0];
    if (tesadufi) return ad(tesadufi) + ' gaz tüketimini gerçekten değiştirir mi? Görünen küçük katkı tesadüf olabilir, böyle bağlar yeni günlerde kolayca bozulur.';
    var bos = k.filter(function (x) { return x.tur === 'kol' && Math.abs(x.d) < ESIK; })[0];
    if (bos) return ad(bos) + ' tahmine bir şey katmadı. Yerini başka bir kolona verebilirsiniz.';
    if (d.don !== 'hdd') return 'Sıcaklığı derece gün olarak vermeyi deneyin. Kombi 16 °C’nin üstünde yanmaz, bu bilgiyi modele siz verebilirsiniz.';
    if (cols.indexOf('gun') < 0) return 'Grafikte gölgeli günler hafta sonu. Ofisler ve fabrikalar kapalıyken tüketim nasıl değişiyor?';
    if (cols.indexOf('dun') < 0) return 'Bugünün tüketimi yarın hakkında bir şey söylüyor olabilir mi?';
    if (cols.indexOf('tat') < 0) return 'Grafikteki bayram günlerine bakın. Model orada neden şaşıyor?';
    if (cols.length < MAKS) return 'Hâlâ boş yeriniz var. Tüketimi etkileyebilecek başka bir kolon var mı?';
    return 'Çok iyi. Verdiğiniz her karar tahmine bir şey katıyor.';
  }
  function gecmisHtml() {
    var b = enIyi();
    return '<ul class="gecmis">' + S.denemeler.map(function (d, i) {
      var cls = d.hata === null ? 'yok' : (d.hata === b ? 'en' : '');
      return '<li class="' + cls + '"><span>' + (i + 1) + '. deneme</span><span>' + adlar(d.cols, d.don) + '<small>' + cikarYazi(d.cikar).replace(/^./, function (c) { return c.toLocaleUpperCase('tr'); }) + '</small></span><b>' + (d.hata === null ? 'Geçersiz' : yuzde(d.hata)) + '</b></li>';
    }).join('') + '</ul>';
  }
  function butonlarHtml() {
    var son = kalanHak() === 0;
    return '<div class="ileri">' + (son ? '' : '<button class="tus ana" type="button" id="tekrar">' + ikon('geri') + ' Kurulumu değiştir</button>') +
      '<button class="tus ' + (son ? 'ana' : 'ikincil') + '" type="button" id="kapanis-gec">Kapanışa geç ' + ikon('ok') + '</button></div>' +
      (son ? '' : '<p class="not">' + kalanHak() + ' deneme hakkınız kaldı.</p>');
  }
  function sonucHtml() {
    var d = S.denemeler[S.denemeler.length - 1], no = S.denemeler.length, r = egit(d.cols, d.cikar, d.don);
    var baslik = '<div class="baslik"><p class="ust">' + no + '. deneme · Sonuç</p><h1>' + (d.tuzak ? 'Kusursuz görünen model' : 'Model son iki ayı tahmin etti') + '</h1>' + cipler(d.cols, d.don) +
      '<p class="not">Model ' + r.n + ' günden öğrendi, ' + cikarYazi(d.cikar) + '.</p></div>';
    if (d.tuzak) {
      return '<section class="sahne">' + baslik +
        '<div class="kart tuzak"><p class="kpi-l">Geçmiş veride ortalama hata</p><p class="buyuk">' + yuzde(r.egitimHata) + '</p>' +
        '<h2>Ama yarın için tahmin yapılamadı</h2><p class="giris-metin">Gün sonu sayaç toplamı, tahmin etmek istediğiniz günün kendi tüketimi. Bu bilgi yarın gece belli oluyor, tahmini ise bu gece yapıyorsunuz. Tahmin anında elde olmayan bir kolonla kurulan model sahada çalışmaz.</p>' +
        '<p class="not">Bu deneme geçersiz sayıldı, bu kolon artık seçilemez.</p></div>' +
        '<div class="kart"><h2>Denemeleriniz</h2>' + gecmisHtml() + '</div>' + butonlarHtml() + '</section>';
    }
    var k = katkilar(d.cols, d.cikar, d.don), mx = Math.max.apply(null, k.map(function (x) { return Math.abs(x.d); }).concat([0.5]));
    var gruplar = [['filtre', 'Veri'], ['don', 'Alan bilgisi'], ['kol', 'Kolonlar']], liste = '';
    gruplar.forEach(function (g) {
      var ogeler = k.filter(function (x) { return x.tur === g[0]; }); if (!ogeler.length) return;
      liste += '<li class="grup">' + g[1] + '</li>' + ogeler.map(function (x) {
        var sifir = Math.abs(x.d) < ESIK, cls = sifir ? 'sifir' : (x.d < 0 ? 'eksi' : '');
        var yazi = sifir ? 'Katkısı yok' : (x.d > 0 ? 'Hatayı ' + virgul(x.d, 1) + ' puan azalttı' : 'Hatayı ' + virgul(-x.d, 1) + ' puan artırdı');
        return '<li class="' + cls + '"><div class="k-ust"><b>' + katkiAd(x, d.don) + '</b><span>' + yazi + '</span></div><div class="iz"><i style="width:' + (sifir ? 0 : Math.max(3, 100 * Math.abs(x.d) / mx)).toFixed(1) + '%"></i></div></li>';
      }).join('');
    });
    var tavan = Math.max(UZMAN, d.hata);
    return '<section class="sahne">' + baslik +
      '<div class="kart"><div class="kpi"><div><p class="kpi-l">Yeni günlerde ortalama hata</p><p class="kpi-a">Model bu ' + NTE + ' günü hiç görmedi</p></div><p class="kpi-d">' + yuzde(d.hata) + '</p></div>' +
      '<div class="kiyas"><div><span>Uzman</span><span class="iz"><i style="width:' + (100 * UZMAN / tavan).toFixed(1) + '%"></i></span><b>' + yuzde(UZMAN) + '</b></div>' +
      '<div class="sen"><span>Modeliniz</span><span class="iz"><i style="width:' + Math.max(2, 100 * d.hata / tavan).toFixed(1) + '%"></i></span><b>' + yuzde(d.hata) + '</b></div></div></div>' +
      '<div class="kart"><h2>Son iki ay, günlük tüketim</h2><div class="grafik" id="grafik"></div><div class="lejant"><span><i></i>Gerçek tüketim</span><span><i class="t"></i>Modelin tahmini</span><span><i class="h"></i>Hafta sonu</span></div></div>' +
      '<div class="kart"><h2>Her karar ne kattı?</h2><ul class="katki">' + liste + '</ul><p class="ipucu">' + ikon('bilgi') + '<span>' + ipucu(d, k) + '</span></p></div>' +
      '<div class="kart"><h2>Denemeleriniz</h2>' + gecmisHtml() + '</div>' + butonlarHtml() + '</section>';
  }
  function grafikCiz() {
    var g = $('#grafik'); if (!g) return;
    var d = S.denemeler[S.denemeler.length - 1];
    g.innerHTML = grafikSvg(d && !d.tuzak ? egit(d.cols, d.cikar, d.don).tahmin : null, Math.max(280, Math.round(g.clientWidth)));
  }
  function kapanisHtml() {
    var b = enIyi(), en = egit(EN_IYI.cols, EN_IYI.cikar, EN_IYI.don);
    return '<section class="sahne"><div class="baslik"><p class="ust">Kapanış</p><h1>Model, ona verdiğiniz veri kadar iyi</h1></div>' +
      '<div class="kart"><div class="kpi"><div><p class="kpi-l">' + esc(S.masa || 'Masanız') + ', en iyi sonucunuz</p><p class="kpi-a">Uzmanın hatası ' + yuzde(UZMAN) + '</p></div><p class="kpi-d">' + (b === null ? '?' : yuzde(b)) + '</p></div>' + gecmisHtml() + '</div>' +
      '<div class="kart"><h2>Bu veride en iyi kurulum</h2>' +
      '<div class="kurulum"><p>Eğitimden çıkarılan</p><div class="cipler"><span class="cip acik">' + FILTRE.sifir.ad + '</span></div></div>' +
      '<div class="kurulum"><p>Kolonlar</p>' + cipler(EN_IYI.cols, EN_IYI.don, 'acik') + '</div>' +
      '<p class="not">Yeni günlerde hata ' + yuzde(en.hata) + '. Borsa, maç ve nem gaz tüketimini etkilemiyor. Bayramları ya da hafta sonlarını çıkarmak modeli kötüleştiriyor, gün sonu sayaç toplamı ise tahmin anında elde yok.</p></div>' +
      '<div class="ozet"><h2>Modeli kurarken dört soru</h2><ul class="ozet-l">' +
      '<li><span class="rozet">1</span><div><b>Kayıt doğru mu?</b><p>Veri gelmeyen günlere yazılan 0 gerçek bir ölçüm değil. Sıra dışı ama gerçek günler ise kalmalı.</p></div></li>' +
      '<li><span class="rozet">2</span><div><b>Kolonun hedefle ilgisi var mı?</b><p>Sıcaklık tüketimi değiştirir, borsa değiştirmez.</p></div></li>' +
      '<li><span class="rozet">3</span><div><b>Tahmin anında elde olacak mı?</b><p>Yarının sayaç toplamı ancak yarın gece belli olur.</p></div></li>' +
      '<li><span class="rozet">4</span><div><b>Alan bilgisi modelde mi?</b><p>Kombinin 16 °C’nin üstünde yanmadığını bilen kişi modeli güçlendirir.</p></div></li></ul>' +
      '<p class="son">Algoritma hiç değişmedi, sonucu verdiğiniz kararlar değiştirdi.</p></div>' +
      '<p class="not">En iyi hatanızı ve kurulumunuzu eğitmene söyleyin.</p></section>';
  }

  /* çizim ve olaylar */
  function ciz() {
    var e = $('#ekran'), x = S.ekran;
    e.innerHTML = x === 'giris' ? girisHtml() : x === 'vaka' ? vakaHtml() : x === 'veri' ? veriHtml() : x === 'kolonlar' ? kolonlarHtml() : x === 'sonuc' ? sonucHtml() : kapanisHtml();
    ust();
    if (x === 'veri') veriGuncelle();
    if (x === 'kolonlar') secilenGuncelle();
    if (x === 'sonuc') grafikCiz();
  }
  function git(ekran) { S.ekran = ekran; kaydet(); ciz(); window.scrollTo(0, 0); }
  function sec(id, t) {
    var i = S.secim.indexOf(id);
    if (i >= 0) { S.secim.splice(i, 1); return true; }
    if (S.secim.length < MAKS) { S.secim.push(id); return true; }
    var kart = document.querySelector('[data-kart="' + id + '"]');
    if (kart) { kart.classList.remove('salla'); void kart.offsetWidth; kart.classList.add('salla'); }
    secilenGuncelle('En fazla ' + MAKS + ' kolon seçebilirsiniz');
    return false;
  }
  document.addEventListener('submit', function (ev) {
    if (ev.target.id !== 'giris-form') return;
    ev.preventDefault(); S.masa = ($('#masa').value || '').trim().slice(0, 24); git('vaka');
  });
  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('button'); if (!t || t.id === 'sifirla') return;
    if (t.id === 'veri-gec' || t.id === 'veri-don') { git('veri'); return; }
    if (t.id === 'kolon-gec') { git('kolonlar'); return; }
    if (t.dataset.filtre) {
      var f = t.dataset.filtre, j = S.cikar.indexOf(f);
      if (j >= 0) S.cikar.splice(j, 1); else S.cikar.push(f);
      kaydet(); veriGuncelle(); return;
    }
    if (t.dataset.don) {
      S.don = t.dataset.don;
      if (S.secim.indexOf('sic') < 0 && !sec('sic', t)) { kaydet(); return; }
      kaydet(); secilenGuncelle(); return;
    }
    if (t.dataset.kol) { if (sec(t.dataset.kol, t)) { kaydet(); secilenGuncelle(); } return; }
    if (t.id === 'egit' && S.secim.length && kalanHak() > 0 && !denendi()) {
      var d = { cols: S.secim.slice(), cikar: S.cikar.slice(), don: S.don }, tuzak = d.cols.indexOf('say') >= 0;
      $('#ekran').innerHTML = '<section class="sahne"><div class="kart yukle" role="status"><h2>Model eğitiliyor</h2><p class="not">' + egitimGunu(d.cikar) + ' günlük kayıttan, seçtiğiniz kolonlarla öğreniyor.</p><div class="yukle-c"><i></i></div></div></section>';
      window.scrollTo(0, 0);
      var oturum = S;
      setTimeout(function () {
        if (S !== oturum) return;
        var r = egit(d.cols, d.cikar, d.don);
        d.hata = tuzak ? null : Math.round(r.hata * 100) / 100; d.tuzak = tuzak;
        S.denemeler.push(d);
        if (tuzak) S.tuzak = true;
        git('sonuc');
      }, matchMedia('(prefers-reduced-motion: reduce)').matches ? 50 : 1100);
      return;
    }
    if (t.id === 'tekrar' && !S.bitti) { if (S.tuzak) S.secim = S.secim.filter(function (c) { return c !== 'say'; }); git('veri'); return; }
    if (t.id === 'kapanis-gec') {
      if (kalanHak() > 0 && !t.dataset.onay) {
        t.dataset.onay = '1'; t.textContent = 'Kalan hakkınız yanacak, tekrar dokunun';
        setTimeout(function () { if (t.isConnected) { delete t.dataset.onay; t.innerHTML = 'Kapanışa geç ' + ikon('ok'); } }, 3500);
        return;
      }
      S.bitti = true; git('kapanis'); return;
    }
  });
  var sifirla = $('#sifirla'), onayZaman = null;
  sifirla.addEventListener('click', function () {
    if (sifirla.dataset.onay) {
      clearTimeout(onayZaman); delete sifirla.dataset.onay; sifirla.textContent = 'Baştan başla';
      S = yeni(); kaydet(); ciz(); window.scrollTo(0, 0); return;
    }
    sifirla.dataset.onay = '1'; sifirla.textContent = 'Emin misiniz? Tekrar dokunun';
    onayZaman = setTimeout(function () { delete sifirla.dataset.onay; sifirla.textContent = 'Baştan başla'; }, 3500);
  });
  var rz; window.addEventListener('resize', function () { clearTimeout(rz); rz = setTimeout(function () { grafikCiz(); gecmisCiz(); }, 150); });

  function baslat(data) {
    S = Object.assign(yeni(), data && data.ekran ? data : (yukle() || {}));
    if (!Array.isArray(S.secim) || !Array.isArray(S.denemeler) || !Array.isArray(S.cikar)) S = yeni();
    S.denemeler.forEach(function (d) { d.cikar = d.cikar || []; d.don = d.don || 'ham'; });
    if (S.don !== 'hdd') S.don = 'ham';
    if (S.ekran !== 'giris' && EKRANLAR.indexOf(S.ekran) < 0) S.ekran = 'giris';
    if (S.ekran === 'sonuc' && !S.denemeler.length) S.ekran = 'veri';
    if ((S.ekran === 'veri' || S.ekran === 'kolonlar') && kalanHak() <= 0) S.ekran = 'kapanis';
    if (S.bitti) S.ekran = 'kapanis';
    ciz();
  }
  try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function () { return S; }); } catch (e) {}
  var hot = window.claude && window.claude.hot;
  if (hot && hot.ready) hot.ready(baslat); else baslat(hot && hot.data ? hot.data : {});
})();
</script>
